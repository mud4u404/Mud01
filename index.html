<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>星陨幻世录 · Astral Fantasy Chronicle</title>
  <link rel="stylesheet" href="/src/ui/style.css" />
</head>
<body>
  <div id="app">
    <div id="game-root"></div>
    <div id="hud-layer">
      <!-- 顶部：章节目标 -->
      <div id="objective-chip" class="hidden"></div>
      <!-- 右侧：回合序列 -->
      <div id="turn-order" class="hidden"></div>
      <!-- 单位信息卡 -->
      <div id="unit-card" class="hidden"></div>
      <!-- 指令菜单 -->
      <div id="command-menu" class="hidden"></div>
      <!-- 技能列表 -->
      <div id="skill-menu" class="hidden"></div>
      <!-- 物品列表 -->
      <div id="item-menu" class="hidden"></div>
      <!-- 战斗预测面板 -->
      <div id="forecast-panel" class="hidden"></div>
      <!-- 对话框 -->
      <div id="dialogue-box" class="hidden"></div>
      <!-- 回合横幅 -->
      <div id="turn-banner" class="hidden"></div>
      <!-- 章节开幕横幅 -->
      <div id="chapter-banner" class="hidden"></div>
      <!-- 升级横幅 -->
      <div id="levelup-banner" class="hidden"></div>
      <!-- 技能切入横幅 -->
      <div id="cutin-banner" class="hidden"></div>
      <!-- 结算画面 -->
      <div id="result-screen" class="hidden"></div>
      <!-- 操作提示 -->
      <div id="hint-bar" class="hidden"></div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
