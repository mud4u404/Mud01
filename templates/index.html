<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <title>镖局</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #141410;
      --bg2:       #1c1c16;
      --bg3:       #242418;
      --border:    #2e2e24;
      --text:      #ddd6c0;
      --text-dim:  #7a7060;
      --gold:      #c8962a;
      --red:       #c04040;
      --green:     #4a9a5a;
      --cyan:      #4a8a9a;
      --radius:    6px;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'PingFang SC', 'Hiragino Sans GB', 'STHeiti', 'Microsoft YaHei', sans-serif;
      font-size: 15px;
      line-height: 1.7;
      overflow: hidden;
    }

    /* ── 整体布局 ── */
    #app {
      display: flex;
      flex-direction: column;
      height: 100dvh;
    }

    /* ── 顶部状态栏 ── */
    #status-bar {
      flex-shrink: 0;
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      padding: 8px 16px;
      display: flex;
      gap: 12px;
      font-size: 12px;
      color: var(--text-dim);
      align-items: center;
    }
    #status-bar .s-item { display: flex; align-items: center; gap: 4px; }
    #status-bar .s-val  { color: var(--gold); font-weight: 500; }
    #status-bar .s-hp   { color: var(--green); }
    #status-bar .s-rep  { color: var(--cyan); }
    #status-bar .logo   { margin-left: auto; color: var(--text-dim); font-size: 13px; letter-spacing: 2px; }

    /* ── 主文字区 ── */
    #scroll-area {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 16px 16px 8px;
    }

    .line {
      margin-bottom: 2px;
      animation: appear .25s ease both;
    }
    .line-empty { height: 10px; }
    .divider {
      text-align: center;
      color: var(--text-dim);
      font-size: 12px;
      margin: 14px 0 10px;
      letter-spacing: 2px;
      position: relative;
    }
    .divider::before,
    .divider::after {
      content: '';
      position: absolute;
      top: 50%;
      width: 25%;
      height: 1px;
      background: var(--border);
    }
    .divider::before { left: 0; }
    .divider::after  { right: 0; }

    .line-hit    { color: #e8c878; }
    .line-damage { color: var(--red); }
    .line-gain   { color: var(--green); }
    .line-system { color: var(--cyan); font-size: 13px; }

    @keyframes appear {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── 战斗状态面板 ── */
    #combat-panel {
      flex-shrink: 0;
      background: var(--bg2);
      border-top: 1px solid var(--border);
      padding: 10px 16px 6px;
      display: none;
    }
    #combat-panel.show { display: block; }

    .combatant {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
      font-size: 13px;
    }
    .combatant-name { width: 90px; flex-shrink: 0; }
    .bar-wrap  { flex: 1; background: #1a1a14; border-radius: 3px; height: 7px; overflow: hidden; }
    .bar-fill  { height: 100%; border-radius: 3px; transition: width .4s; }
    .bar-hp    .bar-fill { background: var(--green); }
    .bar-enemy .bar-fill { background: var(--red); }
    .bar-energy .bar-fill { background: var(--cyan); }
    .combatant-hp-text { font-size: 11px; color: var(--text-dim); width: 52px; text-align: right; }

    /* ── 选项区 ── */
    #choices-area {
      flex-shrink: 0;
      padding: 10px 12px 12px;
      background: var(--bg2);
      border-top: 1px solid var(--border);
      max-height: 42vh;
      overflow-y: auto;
    }

    .choice-btn {
      display: block;
      width: 100%;
      padding: 11px 14px;
      margin-bottom: 8px;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-size: 15px;
      text-align: left;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: background .1s;
    }
    .choice-btn:active { background: #2e2e22; }
    .choice-btn .btn-sub {
      display: block;
      font-size: 11px;
      color: var(--text-dim);
      margin-top: 2px;
    }
    .choice-btn.combat  { border-color: #5a2020; }
    .choice-btn.class   { border-color: #2a3a3a; }
    .choice-btn.mission { border-color: #3a3020; }
    .choice-btn.danger  { border-color: #3a2020; color: #888; }
    .choice-btn.disabled{ opacity: .4; pointer-events: none; }

    /* 名字输入 */
    #name-row {
      display: none;
      gap: 8px;
      padding: 10px 12px 12px;
      background: var(--bg2);
      border-top: 1px solid var(--border);
    }
    #name-row.show { display: flex; }
    #name-input {
      flex: 1;
      padding: 10px 12px;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-size: 16px;
    }
    #name-input::placeholder { color: var(--text-dim); }
    #name-submit {
      padding: 10px 18px;
      background: var(--gold);
      border: none;
      border-radius: var(--radius);
      color: #000;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    /* 标题屏 */
    #title-screen {
      position: absolute;
      inset: 0;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 10;
    }
    #title-screen h1 {
      font-size: 48px;
      letter-spacing: 12px;
      color: var(--gold);
      text-shadow: 0 0 30px rgba(200,150,42,.3);
    }
    #title-screen p {
      color: var(--text-dim);
      letter-spacing: 4px;
      font-size: 14px;
    }
    #title-screen .start-btn {
      margin-top: 20px;
      padding: 14px 40px;
      background: transparent;
      border: 1px solid var(--gold);
      border-radius: 4px;
      color: var(--gold);
      font-size: 17px;
      letter-spacing: 4px;
      cursor: pointer;
    }
    #title-screen .start-btn:active { background: rgba(200,150,42,.1); }
  </style>
</head>
<body>

<!-- 标题屏 -->
<div id="title-screen">
  <h1>镖局</h1>
  <p>义字当先，走遍天下</p>
  <button class="start-btn" onclick="startGame()">踏入江湖</button>
</div>

<div id="app" style="display:none">
  <!-- 状态栏 -->
  <div id="status-bar">
    <div class="s-item">
      <span>HP</span>
      <span class="s-val s-hp" id="st-hp">—</span>
    </div>
    <div class="s-item">
      <span>内力</span>
      <span class="s-val" id="st-energy">—</span>
    </div>
    <div class="s-item">
      <span>银两</span>
      <span class="s-val" id="st-silver">—</span>
    </div>
    <div class="s-item">
      <span class="s-rep" id="st-rep">—</span>
    </div>
    <span class="logo">镖</span>
  </div>

  <!-- 主文字区 -->
  <div id="scroll-area"></div>

  <!-- 战斗面板 -->
  <div id="combat-panel">
    <div id="player-row" class="combatant">
      <span class="combatant-name" id="cp-player-name">—</span>
      <div class="bar-wrap bar-hp"><div class="bar-fill" id="cp-player-hp" style="width:100%"></div></div>
      <span class="combatant-hp-text" id="cp-player-hp-text">—</span>
    </div>
    <div id="enemies-rows"></div>
    <div class="combatant" style="margin-top:4px">
      <span class="combatant-name" style="font-size:11px;color:var(--text-dim)">内力</span>
      <div class="bar-wrap bar-energy"><div class="bar-fill" id="cp-player-energy" style="width:100%"></div></div>
      <span class="combatant-hp-text" id="cp-player-energy-text">—</span>
    </div>
  </div>

  <!-- 名字输入 -->
  <div id="name-row">
    <input id="name-input" type="text" placeholder="你的名字" maxlength="10"
           onkeydown="if(event.key==='Enter')submitName()">
    <button id="name-submit" onclick="submitName()">确认</button>
  </div>

  <!-- 选项区 -->
  <div id="choices-area"></div>
</div>

<script>
const scrollArea   = document.getElementById('scroll-area');
const choicesArea  = document.getElementById('choices-area');
const nameRow      = document.getElementById('name-row');
const nameInput    = document.getElementById('name-input');
const combatPanel  = document.getElementById('combat-panel');
let currentState   = 'title';

async function api(endpoint, body={}) {
  const r = await fetch(endpoint, {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify(body),
  });
  return r.json();
}

async function startGame() {
  document.getElementById('title-screen').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  const data = await api('/api/start');
  render(data);
}

async function sendChoice(choiceId) {
  const data = await api('/api/action', {choice_id: choiceId});
  render(data);
}

async function submitName() {
  const name = nameInput.value.trim() || '江湖客';
  nameInput.value = '';
  const data = await api('/api/action', {choice_id: name, text_input: name});
  render(data);
}

function render(data) {
  currentState = data.state;

  // 输出文字
  appendOutput(data.output || []);

  // 更新状态栏
  if (data.player) {
    const p = data.player;
    document.getElementById('st-hp').textContent     = `${p.hp}/${p.max_hp}`;
    document.getElementById('st-energy').textContent = `${p.energy}/${p.max_energy}`;
    document.getElementById('st-silver').textContent = `${p.silver}两`;
    document.getElementById('st-rep').textContent    = p.ma;
  }

  // 战斗面板
  if (data.state === 'combat' && data.player) {
    combatPanel.classList.add('show');
    const p = data.player;
    document.getElementById('cp-player-name').textContent     = p.name;
    document.getElementById('cp-player-hp').style.width       = `${p.hp/p.max_hp*100}%`;
    document.getElementById('cp-player-hp-text').textContent  = `${p.hp}/${p.max_hp}`;
    document.getElementById('cp-player-energy').style.width   = `${p.energy/p.max_energy*100}%`;
    document.getElementById('cp-player-energy-text').textContent = `${p.energy}`;

    const rows = document.getElementById('enemies-rows');
    rows.innerHTML = '';
    (data.enemies || []).forEach(e => {
      const pct = Math.max(0, e.hp/e.max_hp*100).toFixed(1);
      const statusStr = e.status.map(s => ({poison:'☠',bleed:'🩸',defend:'🛡'}[s]||s)).join('');
      rows.innerHTML += `
        <div class="combatant">
          <span class="combatant-name" style="font-size:12px;color:#c05050">
            ${e.name} ${statusStr}
          </span>
          <div class="bar-wrap bar-enemy"><div class="bar-fill" style="width:${pct}%"></div></div>
          <span class="combatant-hp-text">${e.hp}/${e.max_hp}</span>
        </div>`;
    });
  } else {
    combatPanel.classList.remove('show');
  }

  // 名字输入
  if (data.state === 'name_input') {
    nameRow.classList.add('show');
    choicesArea.innerHTML = '';
    setTimeout(() => nameInput.focus(), 100);
  } else {
    nameRow.classList.remove('show');
  }

  // 选项按钮
  if (data.state !== 'name_input') {
    renderChoices(data.choices || []);
  }

  // 自动滚到底部
  scrollArea.scrollTop = scrollArea.scrollHeight;
}

function appendOutput(lines) {
  lines.forEach(line => {
    const div = document.createElement('div');
    if (line.startsWith('__DIV__')) {
      div.className = 'divider';
      div.textContent = line.slice(7);
    } else if (line === '') {
      div.className = 'line line-empty';
    } else {
      div.className = 'line';
      // 简单着色规则
      if (line.startsWith('→ 造成') || line.startsWith('→ 你成功'))
        div.className += ' line-hit';
      else if (line.startsWith('→ 你受到'))
        div.className += ' line-damage';
      else if (line.startsWith('获得') || line.includes('声望 +'))
        div.className += ' line-gain';
      else if (line.startsWith('【'))
        div.className += ' line-system';
      div.textContent = line;
    }
    scrollArea.appendChild(div);
  });
}

function renderChoices(choices) {
  choicesArea.innerHTML = '';
  choices.forEach(c => {
    if (!c || !c.id) return;
    const btn = document.createElement('button');
    btn.className = `choice-btn ${c.type || ''}`;
    btn.innerHTML = c.text + (c.sub ? `<span class="btn-sub">${c.sub}</span>` : '');
    btn.onclick = () => sendChoice(c.id);
    choicesArea.appendChild(btn);
  });
}
</script>
</body>
</html>
