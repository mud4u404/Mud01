<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <title>镖局</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #141410;
      --bg2:      #1c1c16;
      --bg3:      #242418;
      --border:   #2e2e24;
      --text:     #ddd6c0;
      --dim:      #7a7060;
      --gold:     #c8962a;
      --red:      #c04040;
      --green:    #4a9a5a;
      --cyan:     #4a8a9a;
      --purple:   #8a5ab0;
      --r: 6px;
    }

    html, body {
      height: 100%; background: var(--bg); color: var(--text);
      font-family: 'PingFang SC', 'Hiragino Sans GB', 'STHeiti', 'Microsoft YaHei', sans-serif;
      font-size: 15px; line-height: 1.75; overflow: hidden;
    }

    #app { display: flex; flex-direction: column; height: 100dvh; }

    /* ── 顶部状态栏 ── */
    #status-bar {
      flex-shrink: 0; background: var(--bg2);
      border-bottom: 1px solid var(--border);
      padding: 5px 12px; display: flex; gap: 8px;
      font-size: 11px; color: var(--dim); align-items: center; flex-wrap: wrap;
    }
    .s-val { font-weight: 600; }
    .s-hp     { color: var(--green); }
    .s-silver { color: var(--gold); }
    .s-realm  { color: var(--purple); }
    .s-exp    { color: var(--dim); font-size: 10px; }
    #st-realm-bar {
      width: 50px; background: #1a1a14;
      border-radius: 2px; height: 4px; overflow: hidden;
    }
    #st-realm-fill { height: 100%; background: var(--purple); transition: width .5s; border-radius: 2px; }
    .logo { margin-left: auto; color: var(--gold); font-size: 14px; letter-spacing: 2px; opacity: .7; }

    /* 势力抽屉 */
    #faction-toggle {
      flex-shrink: 0; background: var(--bg2);
      border-bottom: 1px solid var(--border);
      padding: 4px 12px; cursor: pointer;
      font-size: 11px; color: var(--dim); display: flex; gap: 16px; align-items: center;
    }
    #faction-toggle:active { background: var(--bg3); }
    .faction-item { display: flex; align-items: center; gap: 4px; }
    .faction-bar {
      width: 40px; height: 3px; background: #1a1a14;
      border-radius: 2px; overflow: hidden; position: relative;
    }
    .faction-fill-pos { position: absolute; left: 50%; top: 0; height: 100%; background: var(--green); border-radius: 2px; }
    .faction-fill-neg { position: absolute; right: 50%; top: 0; height: 100%; background: var(--red); border-radius: 2px; }
    #faction-detail {
      display: none; background: var(--bg2);
      border-bottom: 1px solid var(--border);
      padding: 8px 12px; font-size: 12px;
    }
    #faction-detail.open { display: block; }
    .fd-row { display: flex; justify-content: space-between; margin-bottom: 5px; align-items: center; }
    .fd-name { color: var(--gold); width: 70px; }
    .fd-rep  { color: var(--dim); font-size: 11px; width: 40px; text-align: right; }
    .fd-bar  { flex: 1; height: 5px; background: #1a1a14; border-radius: 3px; overflow: hidden; margin: 0 8px; position: relative; }
    .fd-fill-p { position: absolute; left: 50%; top: 0; height: 100%; background: var(--green); border-radius: 3px; }
    .fd-fill-n { position: absolute; right: 50%; top: 0; height: 100%; background: var(--red); border-radius: 3px; }

    /* ── 主文字区 ── */
    #scroll-area {
      flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
      padding: 14px 16px 8px;
    }
    .line { margin-bottom: 2px; animation: appear .2s ease both; }
    .line-empty { height: 8px; }
    .divider {
      text-align: center; color: var(--dim); font-size: 11px;
      margin: 14px 0 10px; letter-spacing: 3px; position: relative;
    }
    .divider::before, .divider::after {
      content: ''; position: absolute; top: 50%; width: 25%; height: 1px; background: var(--border);
    }
    .divider::before { left: 0; } .divider::after { right: 0; }
    .line-hit    { color: #e8c870; }
    .line-damage { color: var(--red); }
    .line-gain   { color: var(--green); }
    .line-system { color: var(--cyan); font-size: 13px; }
    .line-exp    { color: var(--purple); font-size: 12px; }
    .line-bt     { color: var(--purple); font-weight: 600; letter-spacing: 1px; }
    @keyframes appear {
      from { opacity: 0; transform: translateY(5px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── 战斗面板 ── */
    #combat-panel {
      flex-shrink: 0; background: var(--bg2);
      border-top: 1px solid var(--border);
      padding: 8px 12px 6px; display: none;
    }
    #combat-panel.show { display: block; }
    .combatant { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; font-size: 12px; }
    .c-name { width: 88px; flex-shrink: 0; }
    .bar-wrap  { flex: 1; background: #1a1a14; border-radius: 2px; height: 6px; overflow: hidden; }
    .bar-fill  { height: 100%; border-radius: 2px; transition: width .4s; }
    .bar-hp    .bar-fill { background: var(--green); }
    .bar-enemy .bar-fill { background: var(--red); }
    .bar-energy .bar-fill { background: var(--cyan); }
    .c-num { font-size: 10px; color: var(--dim); width: 50px; text-align: right; flex-shrink: 0; }

    /* ── 选项区 ── */
    #choices-area {
      flex-shrink: 0; padding: 8px 10px 10px;
      background: var(--bg2); border-top: 1px solid var(--border);
      max-height: 44vh; overflow-y: auto;
    }
    .choice-btn {
      display: block; width: 100%; padding: 10px 13px; margin-bottom: 7px;
      background: var(--bg3); border: 1px solid var(--border); border-radius: var(--r);
      color: var(--text); font-size: 14px; text-align: left; cursor: pointer;
      -webkit-tap-highlight-color: transparent; transition: background .1s;
    }
    .choice-btn:active { background: #2e2e22; }
    .choice-btn .btn-sub { display: block; font-size: 11px; color: var(--dim); margin-top: 2px; }
    .choice-btn.combat  { border-color: #5a2020; }
    .choice-btn.class   { border-color: #2a3a3a; }
    .choice-btn.mission { border-color: #3a3020; }
    .choice-btn.danger  { border-color: #3a2020; color: #666; }
    .choice-btn.disabled{ opacity: .35; pointer-events: none; }

    /* ── 名字输入 ── */
    #name-row {
      display: none; gap: 8px; padding: 8px 10px 10px;
      background: var(--bg2); border-top: 1px solid var(--border);
    }
    #name-row.show { display: flex; }
    #name-input {
      flex: 1; padding: 10px 12px; background: var(--bg3);
      border: 1px solid var(--border); border-radius: var(--r);
      color: var(--text); font-size: 16px;
    }
    #name-input::placeholder { color: var(--dim); }
    #name-submit {
      padding: 10px 16px; background: var(--gold); border: none;
      border-radius: var(--r); color: #000; font-size: 15px; font-weight: 600; cursor: pointer;
    }

    /* ── 存/读档 ── */
    #save-bar {
      flex-shrink: 0; background: var(--bg2);
      border-top: 1px solid var(--border);
      padding: 6px 12px; display: flex; gap: 8px;
    }
    .save-btn {
      flex: 1; padding: 7px 0; background: var(--bg3);
      border: 1px solid var(--border); border-radius: var(--r);
      color: var(--dim); font-size: 12px; cursor: pointer; text-align: center;
      -webkit-tap-highlight-color: transparent;
    }
    .save-btn:active { background: #2e2e22; }
    #save-msg { font-size: 11px; color: var(--green); line-height: 2; display: none; }

    /* ── 标题屏 ── */
    #title-screen {
      position: absolute; inset: 0; background: var(--bg);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 14px; z-index: 10;
    }
    #title-screen h1 {
      font-size: 52px; letter-spacing: 16px; color: var(--gold);
      text-shadow: 0 0 40px rgba(200,150,42,.25);
    }
    #title-screen p { color: var(--dim); letter-spacing: 5px; font-size: 13px; }
    #title-screen .start-btn {
      margin-top: 16px; padding: 13px 44px;
      background: transparent; border: 1px solid var(--gold);
      border-radius: 4px; color: var(--gold); font-size: 16px;
      letter-spacing: 4px; cursor: pointer;
    }
    #title-screen .load-btn {
      padding: 10px 30px; background: transparent;
      border: 1px solid var(--dim); border-radius: 4px;
      color: var(--dim); font-size: 14px; letter-spacing: 2px; cursor: pointer;
    }

    /* ── 突破动画遮罩 ── */
    #breakthrough-overlay {
      position: fixed; inset: 0; z-index: 99;
      background: rgba(138, 90, 176, 0.15);
      display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none;
      transition: opacity .4s;
    }
    #breakthrough-overlay.show { opacity: 1; pointer-events: auto; }
    #bt-content {
      text-align: center; padding: 32px 40px;
      background: var(--bg2); border: 1px solid var(--purple);
      border-radius: 8px; max-width: 300px;
    }
    #bt-content h2 { color: var(--purple); font-size: 24px; letter-spacing: 6px; margin-bottom: 12px; }
    #bt-content p  { color: var(--text); font-size: 14px; line-height: 1.8; margin-bottom: 16px; }
    #bt-close {
      padding: 10px 32px; background: var(--purple);
      border: none; border-radius: 4px; color: #fff;
      font-size: 14px; cursor: pointer;
    }
  </style>
</head>
<body>

<!-- 标题屏 -->
<div id="title-screen">
  <h1>镖局</h1>
  <p>义字当先，走遍天下</p>
  <button class="start-btn" onclick="startNewGame()">踏入江湖</button>
  <button class="load-btn"  onclick="loadGame()">读取存档</button>
</div>

<!-- 突破动画 -->
<div id="breakthrough-overlay">
  <div id="bt-content">
    <h2 id="bt-realm">化境</h2>
    <p id="bt-desc">人剑合一，随心所欲</p>
    <button id="bt-close" onclick="closeBT()">继续</button>
  </div>
</div>

<div id="app" style="display:none">
  <!-- 状态栏 -->
  <div id="status-bar">
    <span>HP <span class="s-val s-hp" id="st-hp">—</span></span>
    <span>内力 <span class="s-val" id="st-energy">—</span></span>
    <span>银两 <span class="s-val s-silver" id="st-silver">—</span></span>
    <span class="s-realm" id="st-realm">—</span>
    <span class="s-exp" id="st-exp">—</span>
    <div id="st-realm-bar"><div id="st-realm-fill" style="width:0%"></div></div>
    <span class="logo">镖</span>
  </div>

  <!-- 势力声望折叠栏 -->
  <div id="faction-toggle" onclick="toggleFaction()">
    <span style="color:var(--dim);font-size:10px;flex-shrink:0">势力▾</span>
    <div class="faction-item">
      <span>朝廷</span>
      <div class="faction-bar">
        <div class="faction-fill-pos" id="ft-imperial-p" style="width:0%"></div>
        <div class="faction-fill-neg" id="ft-imperial-n" style="width:0%"></div>
      </div>
    </div>
    <div class="faction-item">
      <span>正道</span>
      <div class="faction-bar">
        <div class="faction-fill-pos" id="ft-orthodox-p" style="width:0%"></div>
        <div class="faction-fill-neg" id="ft-orthodox-n" style="width:0%"></div>
      </div>
    </div>
    <div class="faction-item">
      <span>黑道</span>
      <div class="faction-bar">
        <div class="faction-fill-pos" id="ft-underworld-p" style="width:0%"></div>
        <div class="faction-fill-neg" id="ft-underworld-n" style="width:0%"></div>
      </div>
    </div>
  </div>
  <div id="faction-detail">
    <div class="fd-row">
      <span class="fd-name">朝廷</span>
      <div class="fd-bar">
        <div class="fd-fill-p" id="fd-imperial-p" style="width:0%"></div>
        <div class="fd-fill-n" id="fd-imperial-n" style="width:0%"></div>
      </div>
      <span class="fd-rep" id="fd-imperial-v">0</span>
    </div>
    <div class="fd-row">
      <span class="fd-name">武林正道</span>
      <div class="fd-bar">
        <div class="fd-fill-p" id="fd-orthodox-p" style="width:0%"></div>
        <div class="fd-fill-n" id="fd-orthodox-n" style="width:0%"></div>
      </div>
      <span class="fd-rep" id="fd-orthodox-v">0</span>
    </div>
    <div class="fd-row">
      <span class="fd-name">江湖黑道</span>
      <div class="fd-bar">
        <div class="fd-fill-p" id="fd-underworld-p" style="width:0%"></div>
        <div class="fd-fill-n" id="fd-underworld-n" style="width:0%"></div>
      </div>
      <span class="fd-rep" id="fd-underworld-v">0</span>
    </div>
  </div>

  <!-- 主文字区 -->
  <div id="scroll-area"></div>

  <!-- 战斗面板 -->
  <div id="combat-panel">
    <div class="combatant">
      <span class="c-name" id="cp-pname">—</span>
      <div class="bar-wrap bar-hp"><div class="bar-fill" id="cp-php" style="width:100%"></div></div>
      <span class="c-num" id="cp-php-n">—</span>
    </div>
    <div id="enemy-rows"></div>
    <div class="combatant" style="margin-top:2px">
      <span class="c-name" style="font-size:10px;color:var(--dim)">内力</span>
      <div class="bar-wrap bar-energy"><div class="bar-fill" id="cp-penergy" style="width:100%"></div></div>
      <span class="c-num" id="cp-penergy-n">—</span>
    </div>
  </div>

  <!-- 名字输入 -->
  <div id="name-row">
    <input id="name-input" type="text" placeholder="输入你的名字" maxlength="10"
           onkeydown="if(event.key==='Enter')submitName()">
    <button id="name-submit" onclick="submitName()">确认</button>
  </div>

  <!-- 选项区 -->
  <div id="choices-area"></div>

  <!-- 存读档 -->
  <div id="save-bar">
    <button class="save-btn" onclick="saveGame()">存档</button>
    <button class="save-btn" onclick="loadGame()">读档</button>
    <button class="save-btn" onclick="resetGame()" style="color:var(--red)">新游戏</button>
    <span id="save-msg"></span>
  </div>
</div>

<script>
const SAVE_KEY = 'biaoju_save_v1';
let currentState = 'title';
let currentRealm = '';

// ── API 封装 ─────────────────────────────────────────────────
async function api(endpoint, body = {}) {
  const r = await fetch(endpoint, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  return r.json();
}

// ── 游戏流程 ─────────────────────────────────────────────────
async function startNewGame() {
  await api('/api/reset');
  showApp();
  const data = await api('/api/start');
  render(data);
}

async function sendChoice(id) {
  const data = await api('/api/action', { choice_id: id });
  render(data);
}

async function submitName() {
  const name = document.getElementById('name-input').value.trim() || '江湖客';
  document.getElementById('name-input').value = '';
  const data = await api('/api/action', { choice_id: name, text_input: name });
  render(data);
}

async function saveGame() {
  const res = await api('/api/save');
  if (res.ok) {
    localStorage.setItem(SAVE_KEY, JSON.stringify(res.data));
    showMsg('存档成功');
  } else {
    showMsg(res.msg || '存档失败', true);
  }
}

async function loadGame() {
  const raw = localStorage.getItem(SAVE_KEY);
  if (!raw) { showMsg('没有存档', true); return; }
  showApp();
  const data = await api('/api/load', { data: JSON.parse(raw) });
  if (data.ok) {
    appendOutput([data.msg || '读档成功']);
    render(data);
  } else {
    showMsg(data.msg || '读档失败', true);
  }
}

async function resetGame() {
  if (!confirm('开始新游戏？当前进度不会自动保存。')) return;
  startNewGame();
}

// ── 渲染 ─────────────────────────────────────────────────────
function render(data) {
  if (!data) return;
  currentState = data.state;

  appendOutput(data.output || []);

  // 状态栏
  if (data.player) {
    const p = data.player;
    document.getElementById('st-hp').textContent     = `${p.hp}/${p.max_hp}`;
    document.getElementById('st-energy').textContent = `${p.energy}/${p.max_energy}`;
    document.getElementById('st-silver').textContent = `${p.silver}两`;
    document.getElementById('st-realm').textContent  = `${p.ma} · ${p.realm || ''}`;

    // 境界经验条
    const expStr = p.exp_progress || '';
    document.getElementById('st-exp').textContent = expStr === '已臻化境' ? '' : `悟·${expStr}`;
    if (expStr && expStr !== '已臻化境') {
      const parts = expStr.split('/');
      const pct = parts.length === 2 ? Math.min(100, (parseInt(parts[0]) / parseInt(parts[1])) * 100) : 0;
      document.getElementById('st-realm-fill').style.width = pct + '%';
    }

    // 势力声望
    if (p.faction_rep) renderFaction(p.faction_rep);

    // 突破动画
    if (data.breakthrough && p.realm !== currentRealm) {
      currentRealm = p.realm;
      triggerBT(p.realm, '武学境界更进一层');
    }
  }

  // 战斗面板
  if (data.state === 'combat' && data.player) {
    const p = data.player;
    document.getElementById('combat-panel').classList.add('show');
    document.getElementById('cp-pname').textContent   = p.name;
    document.getElementById('cp-php').style.width     = `${p.hp / p.max_hp * 100}%`;
    document.getElementById('cp-php-n').textContent   = `${p.hp}/${p.max_hp}`;
    document.getElementById('cp-penergy').style.width = `${p.energy / p.max_energy * 100}%`;
    document.getElementById('cp-penergy-n').textContent = p.energy;

    const rows = document.getElementById('enemy-rows');
    rows.innerHTML = '';
    (data.enemies || []).forEach(e => {
      const pct = Math.max(0, e.hp / e.max_hp * 100).toFixed(1);
      const st = e.status.map(s => ({ poison: '☠', bleed: '🩸', defend: '🛡' }[s] || s)).join('');
      rows.innerHTML += `
        <div class="combatant">
          <span class="c-name" style="font-size:11px;color:#c05050">${e.name} ${st}</span>
          <div class="bar-wrap bar-enemy"><div class="bar-fill" style="width:${pct}%"></div></div>
          <span class="c-num">${e.hp}/${e.max_hp}</span>
        </div>`;
    });
  } else {
    document.getElementById('combat-panel').classList.remove('show');
  }

  // 名字输入框
  const nameRow = document.getElementById('name-row');
  if (data.state === 'name_input') {
    nameRow.classList.add('show');
    document.getElementById('choices-area').innerHTML = '';
    setTimeout(() => document.getElementById('name-input').focus(), 100);
  } else {
    nameRow.classList.remove('show');
  }

  // 选项按钮
  if (data.state !== 'name_input') renderChoices(data.choices || []);

  // 滚到底
  const sa = document.getElementById('scroll-area');
  sa.scrollTop = sa.scrollHeight;
}

function appendOutput(lines) {
  const sa = document.getElementById('scroll-area');
  lines.forEach(line => {
    const div = document.createElement('div');
    if (line.startsWith('__DIV__')) {
      div.className = 'divider';
      div.textContent = line.slice(7);
    } else if (line === '') {
      div.className = 'line line-empty';
    } else {
      div.className = 'line';
      if (line.startsWith('→ 造成') || line.startsWith('→ 你成功'))
        div.className += ' line-hit';
      else if (line.startsWith('→ 你受到') || line.startsWith('→ 攻击落空') === false && line.includes('受到'))
        div.className += ' line-damage';
      else if (line.startsWith('获得') || line.includes('声望 +') || line.includes('HP恢复'))
        div.className += ' line-gain';
      else if (line.startsWith('【') || line.startsWith('  【'))
        div.className += ' line-exp';
      else if (line.includes('武学突破') || line.includes('══'))
        div.className += ' line-bt';
      div.textContent = line;
    }
    sa.appendChild(div);
  });
}

function renderChoices(choices) {
  const area = document.getElementById('choices-area');
  area.innerHTML = '';
  choices.forEach(c => {
    if (!c || !c.id) return;
    const btn = document.createElement('button');
    btn.className = `choice-btn ${c.type || ''}`;
    btn.innerHTML = c.text + (c.sub ? `<span class="btn-sub">${c.sub}</span>` : '');
    btn.onclick = () => sendChoice(c.id);
    area.appendChild(btn);
  });
}

// ── 势力声望 ─────────────────────────────────────────────────
function renderFaction(fr) {
  const factions = ['imperial', 'orthodox', 'underworld'];
  factions.forEach(f => {
    const rep = fr[f] || 0;
    const pct = Math.abs(rep) / 100 * 50;
    // 紧凑条
    document.getElementById(`ft-${f}-p`).style.width = rep > 0 ? pct + '%' : '0%';
    document.getElementById(`ft-${f}-n`).style.width = rep < 0 ? pct + '%' : '0%';
    // 展开详情
    document.getElementById(`fd-${f}-p`).style.width = rep > 0 ? pct + '%' : '0%';
    document.getElementById(`fd-${f}-n`).style.width = rep < 0 ? pct + '%' : '0%';
    document.getElementById(`fd-${f}-v`).textContent = (rep >= 0 ? '+' : '') + rep;
    document.getElementById(`fd-${f}-v`).style.color = rep > 0 ? 'var(--green)' : rep < 0 ? 'var(--red)' : 'var(--dim)';
  });
}

function toggleFaction() {
  document.getElementById('faction-detail').classList.toggle('open');
}

// ── 突破动画 ─────────────────────────────────────────────────
function triggerBT(realmName, desc) {
  document.getElementById('bt-realm').textContent = realmName;
  document.getElementById('bt-desc').textContent  = desc;
  const ov = document.getElementById('breakthrough-overlay');
  ov.classList.add('show');
  // iOS 震动
  if (navigator.vibrate) navigator.vibrate([80, 40, 80, 40, 200]);
}
function closeBT() {
  document.getElementById('breakthrough-overlay').classList.remove('show');
}

// ── 工具 ─────────────────────────────────────────────────────
function showApp() {
  document.getElementById('title-screen').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
}

function showMsg(msg, isErr = false) {
  const el = document.getElementById('save-msg');
  el.textContent = msg;
  el.style.color = isErr ? 'var(--red)' : 'var(--green)';
  el.style.display = 'inline';
  setTimeout(() => el.style.display = 'none', 2000);
}

// 自动恢复会话（页面刷新不丢失）
window.onload = async () => {
  const data = await api('/api/start');
  if (data.player) {
    showApp();
    render(data);
  }
};
</script>
</body>
</html>
